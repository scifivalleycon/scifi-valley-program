name: Review console gallery integration
on:
  push:
    branches: [console-gallery-oct-2026]
    paths:
      - '.github/workflows/console-gallery-check.yml'
      - 'tools/finalize-console-gallery.py'
      - 'tools/test-console-gallery.py'
      - 'console-gallery.js'
      - 'console-gallery.css'
permissions:
  contents: write
concurrency:
  group: console-gallery-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install review tools
        run: |
          python -m pip install Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Preserve existing console details and polish accessibility
        run: |
          git fetch origin e39273ec44acde80e81d41e41c42849a258912a2 --depth=1
          python tools/finalize-console-gallery.py
          node --check app.js
          node --check event-guide-ui.js
          node --check console-gallery.js
          node --check service-worker.js
      - name: Test mobile, desktop, 200 percent text and image behavior
        run: python tools/test-console-gallery.py
      - name: Commit tested final files to review branch only
        run: |
          git config user.name 'Sci-Fi Valley Con Gallery Build'
          git config user.email 'info@scifivalleycon.com'
          git add console-gallery.js data/events.json tools/test-console-gallery.py
          git diff --cached --quiet || git commit -m 'Preserve existing console descriptions and validate 200 percent text'
          git push origin HEAD:console-gallery-oct-2026
          git archive --format=zip HEAD -o .console-review/source.zip
          git rev-parse HEAD
          git diff --stat e39273ec44acde80e81d41e41c42849a258912a2 HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-gallery-final-review
          path: .console-review/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
