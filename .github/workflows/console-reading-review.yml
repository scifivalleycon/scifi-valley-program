name: Test unobstructed console image controls
on:
  push:
    branches: [console-reading-controls-oct-2026]
    paths:
      - 'tools/*console-reading*'
      - '.github/workflows/console-reading-review.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch only verified console source and release markers
        run: |
          python tools/apply-console-reading.py
          node --check console-gallery.js
          node --check app.js
          node --check service-worker.js
      - name: Install isolated browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test image-only pinch, clear reading area, navigation, and mobile layouts
        run: python tools/test-console-reading.py
      - name: Store tested source on review branch only
        run: |
          git config user.name 'Sci-Fi Valley Con App Build'
          git config user.email 'info@scifivalleycon.com'
          git add console-gallery.js console-gallery.css app.js index.html service-worker.js data/version.json
          git diff --cached --quiet || git commit -m 'Keep console arrows below posters and add image-only pinch zoom'
          git push origin HEAD:console-reading-controls-oct-2026
          git archive --format=zip HEAD -o .console-reading-review/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-reading-review
          path: .console-reading-review/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
