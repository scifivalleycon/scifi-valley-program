name: Verify console reading in WebKit
on:
  push:
    branches: [console-reading-controls-oct-2026]
    paths: ['.github/workflows/console-webkit-verify.yml']
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install WebKit test engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps webkit
      - name: Verify reading controls, touch handlers and all console navigation in WebKit
        run: |
          python - <<'PY'
          from pathlib import Path
          file=Path('tools/test-console-reading.py').resolve()
          code=file.read_text().replace('p.chromium.launch','p.webkit.launch')
          driver='''class TouchDriver:
              def send(self, method, params):
                  page.evaluate(''' + repr('''({type,touchPoints}) => {
                    const target=document.querySelector('.console-viewer-stage');
                    // WebKit does not expose constructible Touch objects in this
                    // test engine. Exercise the same handlers with touch-shaped
                    // fixture data without changing the production implementation.
                    const touches=touchPoints.map(p=>({identifier:p.id,target,
                      clientX:p.x,clientY:p.y,pageX:p.x+scrollX,pageY:p.y+scrollY}));
                    const event=new Event(type.toLowerCase(),{bubbles:true,cancelable:true});
                    Object.defineProperties(event,{
                      touches:{value:touches},targetTouches:{value:touches},
                      changedTouches:{value:touches}
                    });
                    target.dispatchEvent(event);
                  }''') + ''',params)
             cdp=TouchDriver()'''
          code=code.replace('cdp=context.new_cdp_session(page)',driver)
          code=code.replace('Native two-finger pinch zooms only the poster','WebKit touch-event handlers zoom only the poster')
          exec(compile(code,str(file),'exec'),{'__file__':str(file),'__name__':'__main__'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-reading-webkit-review
          path: .console-reading-review/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
