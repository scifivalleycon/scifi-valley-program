name: Test Event Guide shortcut colors
on:
  push:
    branches: [event-guide-colors-oct-2026]
    paths:
      - '.github/workflows/guide-colors-review.yml'
      - 'tools/event-guide-shortcut-theme.css'
      - 'tools/update-guide-colors.py'
      - 'tools/test-guide-colors.py'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme only to verified source
        run: |
          python tools/update-guide-colors.py
          node --check app.js
          node --check service-worker.js
      - name: Install isolated browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test consistent colors, layout and links in Chromium and WebKit
        run: python tools/test-guide-colors.py
      - name: Store tested source on review branch only
        run: |
          test "$GITHUB_REF_NAME" = "event-guide-colors-oct-2026"
          git config user.name "scifivalleycon"
          git config user.email "info@scifivalleycon.com"
          git add event-guide-layout.css index.html app.js service-worker.js data/version.json
          git commit -m "Apply verified Event Guide shortcut theme (v4.114)"
          git push origin HEAD:event-guide-colors-oct-2026
          git rev-parse HEAD > .guide-colors-review/tested-commit.txt
          git ls-tree HEAD event-guide-layout.css index.html app.js service-worker.js data/version.json > .guide-colors-review/tested-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-colors-review
          path: .guide-colors-review/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
